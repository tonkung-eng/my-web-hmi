<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Web HMI - Semiconductor Test Summary</title>
    <!-- อ่านไฟล์ Excel ด้วย SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #fff; padding: 20px; }
        .hmi-container { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .hmi-card { background: #2b2b36; border: 2px solid #3f3f52; border-radius: 8px; padding: 15px; min-width: 220px; flex: 1; text-align: center; }
        .hmi-value { font-size: 1.5em; font-weight: bold; color: #00ffcc; margin: 8px 0; word-break: break-all; }
        .hmi-label { font-size: 0.85em; color: #aaa; text-transform: uppercase; }
        
        .controls { margin-top: 20px; background: #2b2b36; padding: 15px; border-radius: 8px; border: 1px solid #3f3f52; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        select { background: #1e1e24; color: #fff; border: 1px solid #3f3f52; padding: 8px 12px; border-radius: 4px; font-size: 1em; }
        
        /* สไตล์ตารางข้อมูล */
        .table-wrapper { margin-top: 20px; max-height: 500px; overflow-y: auto; overflow-x: auto; background: #2b2b36; border: 1px solid #3f3f52; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; white-space: nowrap; }
        th, td { border: 1px solid #3f3f52; padding: 8px 12px; text-align: left; }
        th { background: #3f3f52; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background: #252530; }
        
        .status { color: #888; font-size: 0.9em; margin-bottom: 10px; }
        .sub-list { font-size: 0.75em; color: #ddd; text-align: left; margin-top: 5px; max-height: 90px; overflow-y: auto; padding-left: 15px; }
    </style>
</head>
<body>

    <h2>Summary_Swift_All</h2>
    <div id="status" class="status">กำลังโหลดไฟล์ Summary_Swift_all.xlsx...</div>

    <!-- ส่วนเลือก Sheet, ปี, WW และ TesterName -->
    <div class="controls">
        <div class="control-group">
            <label for="sheetSelect"><b>Sheet:</b></label>
            <select id="sheetSelect" onchange="onSheetChange()">
                <option value="">-- โหลด Sheet --</option>
            </select>
        </div>

        <div class="control-group">
            <label for="yearSelect"><b>ปี:</b></label>
            <select id="yearSelect" onchange="filterData()">
                <option value="ALL">-- ทั้งหมด (All Years) --</option>
            </select>
        </div>

        <div class="control-group">
            <label for="wwSelect"><b>WW:</b></label>
            <select id="wwSelect" onchange="filterData()">
                <option value="ALL">-- ทั้งหมด (All WW) --</option>
            </select>
        </div>

        <div class="control-group">
            <label for="testerSelect"><b>Tester:</b></label>
            <select id="testerSelect" onchange="filterData()">
                <option value="ALL">-- ทั้งหมด (All Testers) --</option>
            </select>
        </div>
<!-- เพิ่มปุ่มนี้ไว้แถวๆ ส่วน controls ด้านบน -->
<div class="control-group">
    <button onclick="reloadExcelData()" style="background: #00ffcc; color: #1e1e24; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">
        🔄 โหลดข้อมูลใหม่จาก Excel
    </button>
</div>
    </div>

    <!-- ส่วนแสดงการ์ดสรุปจำนวนงาน -->
    <div class="hmi-container">
        <div class="hmi-card">
            <div class="hmi-label">จำนวนงานทั้งหมด</div>
            <div class="hmi-value" id="totalJobs">--</div>
        </div>
        <div class="hmi-card">
            <div class="hmi-label">จำนวนงานแยกตามเครื่อง</div>
            <div class="sub-list" id="testerSummary">--</div>
        </div>
        <div class="hmi-card">
            <div class="hmi-label">จำนวนงานแยกตามวัน</div>
            <div class="sub-list" id="dateSummary">--</div>
        </div>
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <h3>ตารางแสดงข้อมูล</h3>
    <div class="table-wrapper">
        <div id="tableContainer">กำลังรอข้อมูล...</div>
    </div>

    <script>
        let globalWorkbook = null;
        let currentSheetData = []; 
        const ignoredSheets = ['Unit', 'sbl_all', 'PartNumber'];

        window.addEventListener('DOMContentLoaded', () => {
            loadExcelAuto();
        });

        function loadExcelAuto() {
            fetch('Summary_Swift_all.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('ไม่พบไฟล์ Summary_Swift_all.xlsx ในโฟลเดอร์');
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    globalWorkbook = XLSX.read(data, { type: 'array' });

                    const select = document.getElementById('sheetSelect');
                    select.innerHTML = '';
                    
                    const validSheets = globalWorkbook.SheetNames.filter(name => !ignoredSheets.includes(name));

                    validSheets.forEach(sheetName => {
                        const option = document.createElement('option');
                        option.value = sheetName;
                        option.textContent = sheetName;
                        select.appendChild(option);
                    });

                    if (validSheets.length > 0) {
                        onSheetChange();
                    }
                    document.getElementById('status').innerText = 'โหลดข้อมูลสำเร็จ!';
                })
                .catch(error => {
                    document.getElementById('status').innerText = 'เกิดข้อผิดพลาด: ' + error.message;
                    console.error('Error loading Excel:', error);
                });
        }

        // เมื่อเปลี่ยน Sheet ให้ดึงค่า ปี, WW, Tester มาใส่ใน Dropdown ใหม่
        function onSheetChange() {
            const sheetName = document.getElementById('sheetSelect').value;
            if (!sheetName) return;

            const worksheet = globalWorkbook.Sheets[sheetName];
            currentSheetData = XLSX.utils.sheet_to_json(worksheet);

            let yearSet = new Set();
            let wwSet = new Set();
            let testerSet = new Set();

            currentSheetData.forEach(row => {
                let rawDate = row.LotEndTime || row.lotEndTime || '';
                if (rawDate) {
                    let yearStr = String(rawDate).split('-')[0].split('T')[0].trim();
                    if (yearStr.length === 4) yearSet.add(yearStr);
                }

                let ww = row.WW || row.ww;
                let tester = row.TesterName || row.testerName;
                if (ww !== undefined && ww !== null && ww !== '') wwSet.add(String(ww));
                if (tester !== undefined && tester !== null && tester !== '') testerSet.add(String(tester));
            });

            // เติมข้อมูลลง Dropdown ปี
            const yearSelect = document.getElementById('yearSelect');
            yearSelect.innerHTML = '<option value="ALL">-- ทั้งหมด (All Years) --</option>';
            Array.from(yearSet).sort().forEach(year => {
                let opt = document.createElement('option');
                opt.value = year;
                opt.textContent = year;
                yearSelect.appendChild(opt);
            });

            // เติมข้อมูลลง Dropdown WW
            const wwSelect = document.getElementById('wwSelect');
            wwSelect.innerHTML = '<option value="ALL">-- ทั้งหมด (All WW) --</option>';
            Array.from(wwSet).sort((a,b) => Number(a)-Number(b)).forEach(ww => {
                let opt = document.createElement('option');
                opt.value = ww;
                opt.textContent = ww;
                wwSelect.appendChild(opt);
            });

            // เติมข้อมูลลง Dropdown Tester
            const testerSelect = document.getElementById('testerSelect');
            testerSelect.innerHTML = '<option value="ALL">-- ทั้งหมด (All Testers) --</option>';
            Array.from(testerSet).sort().forEach(tester => {
                let opt = document.createElement('option');
                opt.value = tester;
                opt.textContent = tester;
                testerSelect.appendChild(opt);
            });

            filterData();
        }

        // กรองข้อมูลตาม ปี, WW และ Tester ที่เลือก
        function filterData() {
            const selectedYear = document.getElementById('yearSelect').value;
            const selectedWW = document.getElementById('wwSelect').value;
            const selectedTester = document.getElementById('testerSelect').value;

            let filteredData = currentSheetData.filter(row => {
                let rawDate = String(row.LotEndTime || row.lotEndTime || '');
                let rowYear = rawDate.split('-')[0].split('T')[0].trim();
                let rowWW = String(row.WW || row.ww || '');
                let rowTester = String(row.TesterName || row.testerName || '');

                let yearMatch = (selectedYear === 'ALL') || (rowYear === selectedYear);
                let wwMatch = (selectedWW === 'ALL') || (rowWW === selectedWW);
                let testerMatch = (selectedTester === 'ALL') || (rowTester === selectedTester);

                return yearMatch && wwMatch && testerMatch;
            });

            updateDisplay(filteredData);
        }

        // อัปเดตการแสดงผลการ์ดและตาราง
        function updateDisplay(data) {
            document.getElementById('totalJobs').innerText = data.length;

            let testerCounts = {};
            let dateCounts = {};

            data.forEach(row => {
                let tester = row.TesterName || row.testerName || 'Unknown';
                testerCounts[tester] = (testerCounts[tester] || 0) + 1;

                let rawDate = row.LotEndTime || row.lotEndTime || '';
                if (rawDate) {
                    let dateStr = String(rawDate).split('T')[0].split(' ')[0];
                    dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
                }
            });

            let testerHtml = '<ul>';
            for (let [tester, count] of Object.entries(testerCounts)) {
                testerHtml += `<li><b>${tester}:</b> ${count} งาน</li>`;
            }
            testerHtml += '</ul>';
            document.getElementById('testerSummary').innerHTML = Object.keys(testerCounts).length > 0 ? testerHtml : 'ไม่พบข้อมูล Tester';

            let dateHtml = '<ul>';
            for (let [date, count] of Object.entries(dateCounts)) {
                dateHtml += `<li><b>${date}:</b> ${count} งาน</li>`;
            }
            dateHtml += '</ul>';
            document.getElementById('dateSummary').innerHTML = Object.keys(dateCounts).length > 0 ? dateHtml : 'ไม่พบข้อมูลวันที่';

            if (data.length > 0) {
                let newWs = XLSX.utils.json_to_sheet(data);
                document.getElementById('tableContainer').innerHTML = XLSX.utils.sheet_to_html(newWs);
            } else {
                document.getElementById('tableContainer').innerHTML = '<p style="padding: 20px; text-align: center; color: #888;">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</p>';
            }
        }
    </script>
</body>
</html>
